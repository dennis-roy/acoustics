name: Acoustic core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bench build tools
        run: |
          python -m pip install numpy
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --max-time 180 -o xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          curl -fsSL --retry 3 --max-time 30 -o xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz.sha https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz.sha
          printf '%s  %s\n' "$(awk 'NR==1 {print $1}' xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz.sha)" xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz | sha256sum --check
          mkdir arm-toolchain
          tar -xzf xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz --strip-components=1 -C arm-toolchain
          echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"
      - name: Run reference checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python bench/simulate.py tone "$RUNNER_TEMP/tone.acou"
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ifirmware firmware/decimator.c tests/check_decimator.c -lm -o "$RUNNER_TEMP/check_decimator"
          "$RUNNER_TEMP/check_decimator"
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware firmware/stream_frame.c tests/check_stream.c -o "$RUNNER_TEMP/check_stream"
          "$RUNNER_TEMP/check_stream"
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive
      - name: Cross-compile both Pico 2 W images
        run: |
          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          cmake -S firmware -B "$RUNNER_TEMP/acoustic-build" -DPICO_BOARD=pico2_w -DACOUSTIC_ENABLE_MIC=ON -DACOUSTIC_CLOCK_GPIO=0 -DACOUSTIC_DATA_GPIO=1 -DACOUSTIC_SAMPLE_HIGH=1 -DACOUSTIC_SETTLE_WORDS=0
          cmake --build "$RUNNER_TEMP/acoustic-build" -j2
          test -s "$RUNNER_TEMP/acoustic-build/acoustic_synthetic.uf2"
          test -s "$RUNNER_TEMP/acoustic-build/acoustic_microphone.uf2"
